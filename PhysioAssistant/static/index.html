<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiotherapy Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --bg-gradient: linear-gradient(135deg, #E0E7FF 0%, #C7D2FE 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --assistant-msg: #FFFFFF;
            --user-msg: #4F46E5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.9);
        }

        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .header-info h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
        }

        .header-info p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            display: inline-block;
        }

        .messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            animation: slideIn 0.3s ease forwards;
            line-height: 1.6;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--assistant-msg);
            padding: 16px 20px;
            border-radius: 20px 20px 20px 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
            color: var(--text-main);
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            padding: 16px 20px;
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.2);
        }

        .message.assistant strong {
            color: var(--primary);
            font-weight: 600;
        }

        /* Loading Indicator */
        .typing {
            display: none;
            align-self: flex-start;
            background: var(--assistant-msg);
            padding: 16px 20px;
            border-radius: 20px 20px 20px 4px;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: var(--primary-light);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 24px;
            background: rgba(255,255,255,0.5);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            padding: 18px 24px;
            border: none;
            border-radius: 30px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: scale(1.05);
            background: #4338CA;
        }

        button:active {
            transform: scale(0.95);
        }
        
        /* Markdown formatting for assistant */
        .message.assistant ul {
            margin-left: 20px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .message.assistant p {
            margin-bottom: 10px;
        }
        .message.assistant p:last-child {
            margin-bottom: 0;
            font-size: 0.9em;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">⚕️</div>
            <div class="header-info">
                <h1>Physiotherapy Assistant</h1>
                <p><span class="online-dot"></span> Clinical AI Online</p>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="messages" id="chatWindow">
            <div class="message assistant">
                Hello! I am your AI Physiotherapy Assistant. How can I help you with your recovery or joint pain today?
            </div>
            
            <!-- Typing Indicator -->
            <div class="typing" id="typingIndicator">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Input Box -->
        <div class="input-area">
            <form id="chatForm" class="input-wrapper">
                <input type="text" id="userInput" placeholder="Describe your pain, injury, or ask for exercises..." autocomplete="off" required>
                <button type="submit">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatWindow = document.getElementById('chatWindow');
        const typingIndicator = document.getElementById('typingIndicator');
        const threadId = 'user_' + Math.random().toString(36).substr(2, 9);

        // Simple markdown parser to convert **bold** and \n to HTML
        function parseMarkdown(text) {
            let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            // Wrap in p tag if not already
            if(!html.startsWith('<p>')) html = '<p>' + html + '</p>';
            return html;
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            
            if (sender === 'assistant') {
                msgDiv.innerHTML = parseMarkdown(text);
            } else {
                msgDiv.textContent = text;
            }
            
            // Insert before typing indicator
            chatWindow.insertBefore(msgDiv, typingIndicator);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Show user message
            addMessage(message, 'user');
            userInput.value = '';
            
            // Show typing indicator
            typingIndicator.style.display = 'block';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, thread_id: threadId })
                });

                const data = await response.json();
                
                // Hide typing
                typingIndicator.style.display = 'none';

                if (response.ok) {
                    addMessage(data.response, 'assistant');
                } else {
                    addMessage("Sorry, I encountered an error: " + (data.detail || "Server error"), 'assistant');
                }
            } catch (err) {
                typingIndicator.style.display = 'none';
                addMessage("Network error. Please check your connection.", 'assistant');
            }
        });
    </script>
</body>
</html>
